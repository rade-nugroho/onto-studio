name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - onto-studio-connectors-and-workbench

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        id: temurin-21
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/engine/pom.xml

      - name: Set up Temurin 25
        if: steps.temurin-21.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/engine/pom.xml

      - name: Test engine
        working-directory: services/engine
        run: mvn -B test

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/ui
        run: npm ci --no-audit --no-fund

      - name: Test UI
        working-directory: apps/ui
        run: npm test

      - name: Install Playwright Chromium
        working-directory: apps/ui
        run: npx playwright install --with-deps chromium

      - name: End-to-end UI
        working-directory: apps/ui
        run: npm run test:e2e
