# Local engine. Published on loopback only. Root filesystem is read-only.
# Ontology files and .onto-studio/evidence.jsonl live on the /data volume.
# Set ENGINE_TOKEN in the environment. Do not put it in this file.

name: onto-studio-dev

services:
  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    image: onto-studio-engine:${ENGINE_IMAGE_TAG:-local}
    read_only: true
    user: "65532:65532"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=128m,uid=65532,gid=65532,mode=1777"
      - "/home/nonroot:rw,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0750"
    ports:
      - "127.0.0.1:7717:7717"
    environment:
      ENGINE_TOKEN:
      ENGINE_BIND: "0.0.0.0"
      ENGINE_PORT: "7717"
    volumes:
      - ${ONTO_STUDIO_DATA:-./data}:/data
    networks:
      - engine
    restart: "no"

networks:
  engine:
    driver: bridge
